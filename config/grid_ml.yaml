# ML grid (code plan v1.2, RQ6). The same cells and seeds (0 .. 199) as grid_extended.yaml,
# so every run pairs with its extended-grid twin: injections, KPIs and C01-C24 must be
# identical (tests/test_ml_consistency.py); only the rows of M01-M03 are new.
# Run-level thresholds of M01-M03 were frozen in config/ml_thresholds.yaml before this grid.
#
#   python -m dqk.ml.detectors build --dataset olist ; ... --dataset retail
#   python run_experiment.py --grid config/grid_ml.yaml --only olist_ml --only olist_ml_lowrate --workers 6 --resume
#   python run_experiment.py --grid config/grid_ml.yaml --only retail_ml --workers 3 --resume

name: ml
rates: [0.01, 0.02, 0.05, 0.10, 0.20]
n_seeds: 200
dq_suite: ml

scenarios:
  - name: olist_ml                       # 25 cells
    dataset: olist
    errors:
      - code: E6
        variant: category_reassign
        mechanisms:
          MCAR: {}
          MAR: {by: category, groups: [bed_bath_table, furniture_decor], weight: 5}
      - code: E6
        variant: category_spelling
        rates: [0.05, 0.10]
        mechanisms:
          MCAR: {}
      - code: E5
        variant: price_x100
        mechanisms:
          MCAR: {}
          MNAR: {by_value: price, strength: 1.0, log: true}
      - code: E5
        variant: price_div100
        rates: [0.05, 0.10]
        mechanisms:
          MCAR: {}
      - code: E4                        # control: silent and harmless in the core suite
        variant: tz_shift_3h
        rates: [0.05]
        mechanisms:
          MCAR: {}

  - name: retail_ml                      # 15 cells
    dataset: retail
    errors:
      - code: E5
        variant: price_x100
        mechanisms:
          MCAR: {}
          MNAR: {by_value: price, strength: 1.0, log: true}
      - code: E3
        variant: missing_customer_id
        mechanisms:
          MCAR: {}

  - name: olist_ml_lowrate                 # 12 cells (N3)
    dataset: olist
    rates: [0.001, 0.0025, 0.005]
    errors:
      - code: E6
        variant: category_reassign
        mechanisms:
          MCAR: {}
          MAR: {by: category, groups: [bed_bath_table, furniture_decor], weight: 5}
      - code: E5
        variant: price_x100
        mechanisms:
          MCAR: {}
          MNAR: {by_value: price, strength: 1.0, log: true}
