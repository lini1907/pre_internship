# dbt project for the staging and mart layers (code plan v1.1, M1).
# KPI and DQ SQL stay outside dbt (decision D1): the experiment runs them in memory.
#
#   cd dbt
#   dbt seed --profiles-dir .      # config/category_translation_extra.csv
#   dbt build --profiles-dir .     # models + tests
name: olist_dq
version: "1.1.0"
config-version: 2
profile: olist_dq

model-paths: ["models"]
seed-paths: ["../config"]   # config/category_translation_extra.csv
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  olist_dq:
    staging:
      +schema: staging
      +materialized: table
    mart:
      +schema: mart
      +materialized: table

seeds:
  olist_dq:
    category_translation_extra:
      +schema: staging
      +column_types:
        product_category_name: varchar
        product_category_name_english: varchar
